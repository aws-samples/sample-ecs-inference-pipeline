      Namespace: Custom/ECSInference
      MetricName: InferenceScalingMetric
      Dimensions:
        - Name: ClusterName
          Value: !Sub '${AWS::StackName}-cluster'
        - Name: ServiceName
          Value: !Sub '${AWS::StackName}-large-inference-service'
      Statistic: Average
      Period: 60
      EvaluationPeriods: 10
      Threshold: 0.1
      ComparisonOperator: LessThanThreshold
      AlarmActions:
        - !Ref LargeScaleInPolicy

  #############################################
  # Observability - SNS Topic, Dashboard, Alarms
  #############################################

  AlarmNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${AWS::StackName}-alarm-notifications'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-alarm-notifications'
        - Key: Project
          Value: !Ref CostAllocationTagProject

  GPUInferenceDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${AWS::StackName}-gpu-inference'
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "text",
              "x": 0, "y": 0, "width": 24, "height": 1,
              "properties": { "markdown": "## Routing" }
            },
            {
              "type": "metric",
              "x": 0, "y": 1, "width": 12, "height": 6,
              "properties": {
                "title": "Routed Requests by Tier",
                "metrics": [
                  [ "Custom/ECSInference", "RoutedRequests", "Tier", "small", { "stat": "Sum", "period": 60, "label": "Small Tier" } ],
                  [ "Custom/ECSInference", "RoutedRequests", "Tier", "large", { "stat": "Sum", "period": 60, "label": "Large Tier" } ]
                ],
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "yAxis": { "left": { "min": 0, "label": "Requests" } }
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 1, "width": 12, "height": 6,
              "properties": {
                "title": "SQS Queue Depth - Both Tiers",
                "metrics": [
                  [ "AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${RequestQueue.QueueName}", { "stat": "Average", "period": 60, "label": "Small Queue" } ],
                  [ "AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${LargeModelRequestQueue.QueueName}", { "stat": "Average", "period": 60, "label": "Large Queue" } ]
                ],
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "yAxis": { "left": { "min": 0, "label": "Messages" } }
              }
            },
            {
              "type": "text",
              "x": 0, "y": 7, "width": 24, "height": 1,
              "properties": { "markdown": "## Small Model Tier (${GPUInferenceService.Name})" }
            },
            {
              "type": "metric",
              "x": 0, "y": 8, "width": 8, "height": 6,
              "properties": {
                "title": "Small - GPU Memory Utilization (%)",
                "metrics": [
                  [ "ECS/ContainerInsights", "TaskGPUMemoryUtilization", "ClusterName", "${ECSCluster}", "ServiceName", "${GPUInferenceService.Name}", { "stat": "Average", "period": 60 } ]
                ],
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "yAxis": { "left": { "min": 0, "max": 100 } }
              }
            },
            {
              "type": "metric",
              "x": 8, "y": 8, "width": 8, "height": 6,
              "properties": {
                "title": "Small - Desired vs Running Tasks",
                "metrics": [
                  [ "ECS/ContainerInsights", "DesiredTaskCount", "ClusterName", "${ECSCluster}", "ServiceName", "${GPUInferenceService.Name}", { "stat": "Average", "period": 60 } ],
                  [ "ECS/ContainerInsights", "RunningTaskCount", "ClusterName", "${ECSCluster}", "ServiceName", "${GPUInferenceService.Name}", { "stat": "Average", "period": 60 } ]
                ],
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "yAxis": { "left": { "min": 0 } }
              }
            },
            {
              "type": "metric",
              "x": 16, "y": 8, "width": 8, "height": 6,
              "properties": {
                "title": "Small - Inference Latency",
                "metrics": [
                  [ "Custom/ECSInference", "InferenceLatency", "ClusterName", "${ECSCluster}", "ServiceName", "${GPUInferenceService.Name}", { "stat": "p50", "period": 60, "label": "p50" } ],
                  [ "...", { "stat": "p95", "period": 60, "label": "p95" } ],
                  [ "...", { "stat": "p99", "period": 60, "label": "p99" } ]
                ],
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "yAxis": { "left": { "min": 0, "label": "ms" } }
              }
            },
            {
              "type": "text",
              "x": 0, "y": 14, "width": 24, "height": 1,
              "properties": { "markdown": "## Large Model Tier (${LargeGPUInferenceService.Name})" }
            },
            {
              "type": "metric",
              "x": 0, "y": 15, "width": 8, "height": 6,
              "properties": {
                "title": "Large - GPU Memory Utilization (%)",
                "metrics": [
                  [ "ECS/ContainerInsights", "TaskGPUMemoryUtilization", "ClusterName", "${ECSCluster}", "ServiceName", "${LargeGPUInferenceService.Name}", { "stat": "Average", "period": 60 } ]
                ],
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "yAxis": { "left": { "min": 0, "max": 100 } }
              }
            },
            {
              "type": "metric",
              "x": 8, "y": 15, "width": 8, "height": 6,
              "properties": {
                "title": "Large - Desired vs Running Tasks",
                "metrics": [
                  [ "ECS/ContainerInsights", "DesiredTaskCount", "ClusterName", "${ECSCluster}", "ServiceName", "${LargeGPUInferenceService.Name}", { "stat": "Average", "period": 60 } ],
                  [ "ECS/ContainerInsights", "RunningTaskCount", "ClusterName", "${ECSCluster}", "ServiceName", "${LargeGPUInferenceService.Name}", { "stat": "Average", "period": 60 } ]
                ],
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "yAxis": { "left": { "min": 0 } }
              }
            },
            {
              "type": "metric",
              "x": 16, "y": 15, "width": 8, "height": 6,
              "properties": {
                "title": "Large - Inference Latency",
                "metrics": [
                  [ "Custom/ECSInference", "InferenceLatency", "ClusterName", "${ECSCluster}", "ServiceName", "${LargeGPUInferenceService.Name}", { "stat": "p50", "period": 60, "label": "p50" } ],
                  [ "...", { "stat": "p95", "period": 60, "label": "p95" } ],
                  [ "...", { "stat": "p99", "period": 60, "label": "p99" } ]
                ],
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "yAxis": { "left": { "min": 0, "label": "ms" } }
              }
            },
            {
              "type": "text",
              "x": 0, "y": 21, "width": 24, "height": 1,
              "properties": { "markdown": "## GPU Hardware (NVIDIA DCGM via Container Insights)" }
            },
            {
              "type": "metric",
              "x": 0, "y": 22, "width": 6, "height": 6,
              "properties": {
                "title": "GPU Utilization (%)",
                "metrics": [
                  [ "ECS/ContainerInsights", "TaskGPUUtilization", "ClusterName", "${ECSCluster}", { "stat": "Average", "period": 60 } ]
                ],
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "yAxis": { "left": { "min": 0, "max": 100 } }
              }
            },
            {
              "type": "metric",
              "x": 6, "y": 22, "width": 6, "height": 6,
              "properties": {
                "title": "GPU Temperature (°C)",
                "metrics": [
                  [ "ECS/ContainerInsights", "TaskGPUTemperature", "ClusterName", "${ECSCluster}", { "stat": "Maximum", "period": 60 } ]
                ],
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "yAxis": { "left": { "min": 0 } },
                "annotations": { "horizontal": [{ "label": "Critical (90°C)", "value": 90, "color": "#d13212" }] }
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 22, "width": 6, "height": 6,
              "properties": {
                "title": "GPU Power Draw (W)",
                "metrics": [
                  [ "ECS/ContainerInsights", "TaskGPUPowerDraw", "ClusterName", "${ECSCluster}", { "stat": "Average", "period": 60 } ]
                ],
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "yAxis": { "left": { "min": 0 } }
              }
            },
            {
              "type": "metric",
              "x": 18, "y": 22, "width": 6, "height": 6,
              "properties": {
                "title": "GPU XID Errors (Restart App)",
                "metrics": [
                  [ "ECS/ContainerInsights", "TaskGPURestartAppXidCount", "ClusterName", "${ECSCluster}", { "stat": "Sum", "period": 60 } ]
                ],
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "yAxis": { "left": { "min": 0 } }
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 28, "width": 12, "height": 6,
              "properties": {
                "title": "GPU VRAM Used (Bytes) by Service",
                "metrics": [
                  [ "ECS/ContainerInsights", "TaskGPUMemoryUsed", "ClusterName", "${ECSCluster}", "ServiceName", "${GPUInferenceService.Name}", { "stat": "Average", "period": 60, "label": "Small Tier" } ],
                  [ "ECS/ContainerInsights", "TaskGPUMemoryUsed", "ClusterName", "${ECSCluster}", "ServiceName", "${LargeGPUInferenceService.Name}", { "stat": "Average", "period": 60, "label": "Large Tier" } ]
                ],
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "yAxis": { "left": { "min": 0, "label": "Bytes" } }
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 28, "width": 12, "height": 6,
              "properties": {
                "title": "Instance GPU Allocation",
                "metrics": [
                  [ "ECS/ContainerInsights", "InstanceGPULimit", "ClusterName", "${ECSCluster}", { "stat": "Sum", "period": 60, "label": "Total GPUs" } ],
                  [ "ECS/ContainerInsights", "InstanceGPUUsageTotal", "ClusterName", "${ECSCluster}", { "stat": "Sum", "period": 60, "label": "Allocated GPUs" } ]
                ],
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "yAxis": { "left": { "min": 0, "label": "GPUs" } }
              }
            }
          ]
        }

  GPUTemperatureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-gpu-temperature-alarm'
      AlarmDescription: Triggers when GPU temperature exceeds 90°C on any task
      Namespace: ECS/ContainerInsights
      MetricName: TaskGPUTemperature
      Dimensions:
        - Name: ClusterName
          Value: !Sub '${AWS::StackName}-cluster'
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 90
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref AlarmNotificationTopic

  GPUXidErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-gpu-xid-error-alarm'
      AlarmDescription: Triggers when NVIDIA XID restart-app errors are detected on any task
      Namespace: ECS/ContainerInsights
      MetricName: TaskGPURestartAppXidCount
      Dimensions:
        - Name: ClusterName
          Value: !Sub '${AWS::StackName}-cluster'
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref AlarmNotificationTopic

  DLQDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-dlq-depth-alarm'
      AlarmDescription: Triggers when DLQ message count exceeds 0
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DeadLetterQueue.QueueName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref AlarmNotificationTopic

Outputs:
  ClusterArn:
    Description: ECS Cluster ARN for service deployments
    Value: !GetAtt ECSCluster.Arn

  InferenceApiUrl:
    Description: API Gateway URL for submitting inference requests
    Value: !Sub 'https://${InferenceApi}.execute-api.${AWS::Region}.amazonaws.com/infer'

  RequestQueueUrl:
    Description: SQS Queue URL for small-model requests (direct access)
    Value: !Ref RequestQueue

  RequestQueueArn:
    Description: SQS Queue ARN for small-model IAM policy references
    Value: !GetAtt RequestQueue.Arn

  LargeModelRequestQueueUrl:
    Description: SQS Queue URL for large-model requests (direct access)
    Value: !Ref LargeModelRequestQueue

  LargeModelRequestQueueArn:
    Description: SQS Queue ARN for large-model IAM policy references
    Value: !GetAtt LargeModelRequestQueue.Arn

  ECRRepositoryUri:
    Description: ECR Repository URI for image push/pull
    Value: !GetAtt InferenceECRRepository.RepositoryUri

  DashboardUrl:
    Description: CloudWatch Dashboard URL for monitoring
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${GPUInferenceDashboard}'

  SmallModelTaskDefinitionArn:
    Description: Small-model Task Definition ARN
    Value: !Ref GPUInferenceTaskDefinition

  LargeModelTaskDefinitionArn:
    Description: Large-model Task Definition ARN
    Value: !Ref LargeGPUInferenceTaskDefinition

  SmallModelServiceName:
    Description: Small-model ECS Service name
    Value: !GetAtt GPUInferenceService.Name

  LargeModelServiceName:
    Description: Large-model ECS Service name
    Value: !GetAtt LargeGPUInferenceService.Name
